# Keep Angular/Pulumi TypeScript and pandas runtime/stub versions compatible.
version: 2
updates:
- package-ecosystem: docker
  directories:
  - /awsbatchgpu/catboost
  - /awsbatchgpu/llm
  - /sqsprotobuf
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker-compose
  directories:
  - /javersdemo
